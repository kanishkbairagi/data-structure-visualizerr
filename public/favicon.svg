<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Graph / Tree Edges -->
  <line x1="32" y1="18" x2="18" y2="44" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="32" y1="18" x2="46" y2="44" stroke="#c084fc" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="18" y1="44" x2="46" y2="44" stroke="#34d399" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Tree Root Node (Top) -->
  <circle cx="32" cy="18" r="8" fill="url(#nodeGrad1)" filter="url(#glow)" />
  <circle cx="32" cy="18" r="4" fill="#ffffff" />

  <!-- Left Child Node -->
  <circle cx="18" cy="44" r="7" fill="url(#nodeGrad2)" filter="url(#glow)" />
  <circle cx="18" cy="44" r="3.5" fill="#ffffff" />

  <!-- Right Child Node -->
  <circle cx="46" cy="44" r="7" fill="url(#nodeGrad3)" filter="url(#glow)" />
  <circle cx="46" cy="44" r="3.5" fill="#ffffff" />
</svg>
